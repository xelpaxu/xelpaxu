name: Nightly profile refresh

on:
  schedule:
    # 1:23 a.m. Philippine time
    - cron: "23 17 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    # The profile README lives on the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render dashboard
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/render.py

      - name: Commit refreshed cards
        run: |
          git add -- README.md assets/
          if git diff --cached --quiet; then
            echo "The dashboard is already up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='paxu myolie <paxu-mochi@example.invalid>' \
            -m "chore: nightly profile refresh"
          git push
